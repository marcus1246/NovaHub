<!DOCTYPE html>
<html>

<head>

<title>NovaHub Workout Session</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="session-page">



<a class="back-btn" href="workouts.html">
⬅ Back To Workouts
</a>





<h1>
🔥 Workout Session
</h1>


<p>
Stay focused. Finish strong.
</p>





<div class="timer-box">


<h2 id="timer">
00:00
</h2>


</div>






<div class="session-controls">


<button onclick="startTimer()">
▶ Start
</button>



<button onclick="pauseTimer()">
⏸ Pause
</button>



<button onclick="stopTimer()">
⏹ Stop
</button>



</div>








<div class="exercise-card">


<h2>
Today's Workout 💪
</h2>


<br>


<p>
🏋️ Push Ups - 3 Sets × 15
</p>


<p>
🦵 Squats - 3 Sets × 20
</p>


<p>
🔥 Burpees - 3 Sets × 10
</p>



</div>






<br><br>



<div class="exercise-card">


<h2>
🏆 Complete Workout
</h2>


<p>
Finish your workout to earn progress.
</p>


<button>
Complete
</button>


</div>





</div>




<script src="workout-session.js"></script>


</body>

</html>
