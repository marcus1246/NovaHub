<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NovaHub Workout Session</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="workout-session">



<a href="workouts.html" class="btn">

⬅ Back To Workouts

</a>





<h1 id="workoutName">

Workout

</h1>



<div class="session-card">



<img id="workoutGif"

src=""

alt="Workout GIF">





<h2 id="difficulty">

Difficulty

</h2>



<h2 id="reward">

⭐ +10 XP

</h2>





<div id="timer">

00:00

</div>





<div class="session-buttons">



<button onclick="startWorkout()">

▶ Start

</button>



<button onclick="pauseWorkout()">

⏸ Pause

</button>



<button onclick="stopWorkout()">

⏹ Stop

</button>



</div>





<button class="complete-btn"

onclick="completeWorkout()">

🏆 Complete Workout

</button>





</div>






</div>





<script src="workout-session.js"></script>


</body>

</html>
