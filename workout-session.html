<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NovaHub Workout Session</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="dashboard">





<!-- SIDEBAR -->


<aside class="sidebar">


<h2>💪 NovaHub</h2>


<nav>


<a href="dashboard.html">
🏠 Dashboard
</a>


<a href="workouts.html">
🏋️ Workouts
</a>


<a href="progress.html">
📈 Progress
</a>


<a href="profile.html">
👤 Profile
</a>


</nav>



<button onclick="logout()">

🚪 Logout

</button>



</aside>








<!-- WORKOUT CONTENT -->


<main class="content">



<h1>
🔥 Workout Session
</h1>






<section class="card exercise-box">



<img 
id="exerciseGif"
src=""
alt="Exercise demonstration"
>



<h2 id="exerciseName">

Loading...

</h2>



<p>

🎯 Target:
<span id="muscles">
</span>

</p>



<p>

⭐ Reward:
<span id="reward">
</span>

</p>



</section>








<section class="card">



<h2>
📖 How To Do It
</h2>


<ol id="instructions">

<li>
Loading instructions...
</li>


</ol>


</section>









<section class="card">



<h2>
⚠️ Avoid These Mistakes
</h2>


<ul id="mistakes">

<li>
Loading...
</li>

</ul>


</section>








<section class="card">



<h2>
🎯 Recommended

</h2>


<p id="sets">

Loading...

</p>


</section>









<section class="card timer-box">



<h2 id="timer">

00:00

</h2>




<div class="session-buttons">


<button onclick="startWorkout()">

▶ Start

</button>



<button onclick="pauseWorkout()">

⏸ Pause

</button>



<button onclick="stopWorkout()">

⏹ Stop

</button>



</div>





<button 
class="complete-btn"
onclick="completeWorkout()">

🏆 Complete Workout

</button>



</section>







</main>



</div>






<script src="workout-session.js"></script>

<script src="sidebar.js"></script>


</body>

</html>
