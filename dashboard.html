<!DOCTYPE html>
<html>

<head>
    <title>NovaHub Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

    <aside class="sidebar">

        <h2>NovaHub 💪</h2>

        <a href="#">Dashboard</a>
        <a href="workouts.html">Workouts</a>
        <a href="#">Progress</a>
        <a href="#">Profile</a>
        <a href="#">Settings</a>

        <button onclick="logout()">Logout</button>

    </aside>



    <main class="content">

        <h1>Welcome, <span id="username"></span> 👋</h1>

        <p>Ready to crush your goals today?</p>


        <div class="cards">

            <div class="card">
                <h3>🔥 Workout Streak</h3>
                <h2>12 Days</h2>
            </div>


            <div class="card">
                <h3>🏋️ Workouts</h3>
                <h2>24</h2>
            </div>


            <div class="card">
                <h3>⚡ Calories</h3>
                <h2>15,200</h2>
            </div>

        </div>



        <div class="workout">

            <h2>Today's Workout</h2>

            <p>💪 Push Ups - 3 sets x 15</p>
            <p>🦵 Squats - 3 sets x 20</p>
            <p>🏃 Running - 20 minutes</p>

        </div>


    </main>


</div>


<script src="dashboard.js"></script>

</body>

</html>
