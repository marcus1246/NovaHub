<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NovaHub Dashboard</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="dashboard">



<!-- SIDEBAR -->

<aside class="sidebar">


<h2>💪 NovaHub</h2>



<nav>


<a href="dashboard.html">
🏠 Dashboard
</a>


<a href="workouts.html">
🏋️ Workouts
</a>


<a href="progress.html">
📈 Progress
</a>


<a href="profile.html">
👤 Profile
</a>


</nav>



<button onclick="logout()">

🚪 Logout

</button>



</aside>







<!-- PAGE CONTENT -->

<main class="content">



<h1>
Welcome back,
<span id="username">
User
</span>
👋
</h1>



<section class="cards">


<div class="card">

<h2>🔥</h2>

<h3>Total Workouts</h3>

<p id="workoutCount">
0
</p>

</div>



<div class="card">

<h2>⭐</h2>

<h3>XP</h3>

<p id="points">
0
</p>

</div>




<div class="card">

<h2>🔥</h2>

<h3>Streak</h3>

<p id="streakCount">
0
</p>

</div>


</section>





<section class="card full-card">


<h2>
📊 Weekly Activity
</h2>


<div class="chart-container">


<p id="chartLoading">
Loading chart...
</p>


<canvas id="weeklyChart"></canvas>


</div>


</section>







<section class="card full-card">


<h2>
🏆 Achievements
</h2>


<div class="achievement-grid">


<div class="badge locked">
🥉
<span>
First Workout
</span>
</div>



<div class="badge locked">
🥈
<span>
10 Workouts
</span>
</div>



<div class="badge locked">
🥇
<span>
50 Workouts
</span>
</div>



</div>


</section>





</main>



</div>





<script src="dashboard.js"></script>

<script src="sidebar.js"></script>


</body>

</html>
