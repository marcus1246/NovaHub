<!DOCTYPE html>
<html>

<head>

<title>NovaHub Sign Up</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="auth-page">


<div class="auth-box">


<h1>
Create Account 💪
</h1>


<input 
id="username" 
type="text" 
placeholder="Username"
>


<br>


<input 
id="email" 
type="email" 
placeholder="Email"
>


<br>


<input 
id="password" 
type="password" 
placeholder="Password"
>


<br><br>


<button onclick="signup()">
Sign Up
</button>



<p>
Already have an account?
</p>


<a href="login.html">
Login
</a>



</div>


</div>



<script src="signup.js"></script>


</body>

</html>
