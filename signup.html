<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NovaHub Signup</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="auth-box">


<h1>
💪 Create Account
</h1>



<input 
type="text"
id="username"
placeholder="Username"
>



<input 
type="email"
id="email"
placeholder="Email"
>



<input 
type="password"
id="password"
placeholder="Password"
>




<h3>
Choose Workout Preference
</h3>


<select id="gender">


<option value="both">
🧍 Everyone
</option>


<option value="male">
👨 Male
</option>


<option value="female">
👩 Female
</option>


</select>






<button onclick="signup()">

Create Account

</button>





<p>

Already have an account?

<a href="login.html">
Login
</a>

</p>



</div>






<script src="signup.js"></script>


</body>

</html>
